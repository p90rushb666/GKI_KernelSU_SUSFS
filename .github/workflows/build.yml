name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Prefetched Stock Configs
        # Hard requirement: without the stock configs there is nothing to build
        # against, so this waits for the producer leg and then fails the job
        # rather than falling through to a live download.
        #
        # The wait is needed because each family leg calls this workflow
        # separately: the producing leg uploads stock-configs-<family> while a
        # consuming leg may already be running, and GitHub indexes artifacts a
        # few seconds after the upload reports success.
        if: inputs.stock_config_artifact != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.stock_config_artifact }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p stock-configs
          for attempt in $(seq 1 40); do
            if gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
                 --jq '.artifacts[].name' 2>/dev/null | grep -Fxq "$ARTIFACT"; then
              gh run download "$RUN_ID" --repo "$REPO" -n "$ARTIFACT" -D stock-configs
              n=$(find stock-configs -name 'stock_*.config' | wc -l)
              echo "stock configs: $n file(s) from $ARTIFACT"
              [ "$n" -gt 0 ] || { echo "::error title=stock configs::$ARTIFACT is empty"; exit 1; }
              exit 0
            fi
            echo "stock configs: $ARTIFACT not uploaded yet (attempt $attempt/40), waiting 15s"
            sleep 15
          done
          echo "::error title=stock configs::$ARTIFACT was never uploaded - refusing to build without the stock configs"
          exit 1

      - name: Validate Page Size
        uses: ./.github/actions/validate-page-size
        with:
          page_size: ${{ inputs.page_size }}
          version: ${{ inputs.version }}
      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v4 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Initialize Config Fragment
        uses: ./.github/actions/initialize-config-fragment
      - name: Enable KPM for SukiSU-Ultra
        if: inputs.root_flavor == 'sukisu-ultra'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
            "${{ github.workspace }}/.github/fragments/enable-kpm-for-sukisu-ultra.fragment" \
            --dest wild_defconfig.fragment --label enable-kpm-for-sukisu-ultra
      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        uses: ./.github/actions/set-build-timestamp-from-kernel-commit
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject incompatible root/SUSFS combinations
        # One step for both: these are a single guard, and splitting them only
        # added two composite actions whose whole body was one echo.
        if: (inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')) || (inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS'))
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.root_flavor }}" = "kowsu" ]; then
            echo "ERROR: KowSU does not work together with SUSFS - re-run with SUSFS off." >&2
          else
            echo "ERROR: FinaSU requires SUSFS - re-run with SUSFS on." >&2
          fi
          exit 1
      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}

  